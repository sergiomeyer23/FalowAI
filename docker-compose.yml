services:
  postgres:
    image: postgres:16-alpine
    container_name: falow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: falow
      POSTGRES_USER: falow
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - falow-postgres-data:/var/lib/postgresql/data

volumes:
  falow-postgres-data:
